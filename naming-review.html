    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { min-width: 0; padding: 16px; border: 1px solid #e1e3e8; border-radius: 17px; background: #fff; }
    .card.changed { border-color: #d8d3ff; box-shadow: 0 0 0 1px #ece9ff inset; }
    .card.review { border-color: #f0c78f; background: #fffaf2; }

    .preview { display: grid; place-items: center; flex: 0 0 58px; width: 58px; height: 58px; border-radius: 14px; background: #f0f1f4; }
    .preview img { width: 32px; height: 32px; object-fit: contain; }
    .meta { min-width: 0; }
    .file { overflow: hidden; color: #858995; font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .node { margin-top: 3px; color: #a0a3ac; font-size: 11px; }

    let currentFilter = 'all';

    function render() {
      const counts = icons.reduce((acc, icon) => {
        const name = cleanName(icon.name);
        acc[name] = (acc[name] || 0) + 1;
        return acc;
      }, {});
      const query = document.querySelector('#search').value.trim().toLowerCase();
      const prepared = icons.map(icon => {
        const current = cleanName(icon.name);
        const proposed = proposals[icon.nodeId] || current;
        return {...icon, current, proposed, changed: proposed !== current, duplicate: counts[current] > 1, review: Boolean(notes[icon.nodeId])};
      });
      const visible = prepared.filter(icon => {
        const matchesQuery = !query || `${icon.current} ${icon.proposed} ${icon.file} ${notes[icon.nodeId] || ''}`.toLowerCase().includes(query);
        const matchesFilter = currentFilter === 'all' || Boolean(icon[currentFilter]);
        return matchesQuery && matchesFilter;
      });

      document.querySelector('#stats').innerHTML = `
        <span class="stat"><strong>${prepared.length}</strong> иконок</span>
        <span class="stat"><strong>${prepared.filter(icon => icon.changed).length}</strong> применённых изменений</span>
        <span class="stat"><strong>${Object.values(counts).filter(count => count > 1).length}</strong> бывших групп дублей</span>
        <span class="stat"><strong>${prepared.filter(icon => icon.review).length}</strong> исправлений с пометкой</span>`;

      document.querySelector('#grid').innerHTML = visible.map(icon => `
        <article class="card${icon.changed ? ' changed' : ''}${icon.review ? ' review' : ''}">
          <div class="top">
            <div class="preview"><img src="public/icons/${encodeURIComponent(icon.file)}" alt=""></div>
            <div class="meta"><div class="file" title="${icon.file}">${icon.file}</div><div class="node">Node ${icon.nodeId}</div></div>
          </div>
          <div class="row"><span class="label">Было</span><code>${icon.current}</code></div>
          <div class="row"><span class="label">Стало</span><code class="${icon.changed ? 'new' : 'same'}">${icon.proposed}</code></div>
          ${icon.duplicate ? '<span class="badge">бывший дубль</span>' : ''}
          ${notes[icon.nodeId] ? `<p class="note">${notes[icon.nodeId]}</p>` : ''}
        </article>`).join('');
      document.querySelector('#empty').style.display = visible.length ? 'none' : 'block';
    }

    const requestedFilter = new URLSearchParams(location.search).get('filter');
    if (['all', 'changed', 'review', 'duplicate'].includes(requestedFilter)) {
      currentFilter = requestedFilter;
      document.querySelector('.filter.active').classList.remove('active');
      document.querySelector(`[data-filter="${currentFilter}"]`).classList.add('active');
    }
    document.querySelector('#search').addEventListener('input', render);
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
      document.querySelector('.filter.active').classList.remove('active');
      button.classList.add('active');
      currentFilter = button.dataset.filter;
      render();
    }));

    render();
  </script>
